[build]
  publish = "."
  functions = "netlify/functions"

# Le dossier supabase/ (scripts de la base) ne doit JAMAIS être servi : le site publie tout le dépôt (publish = ".")
[[redirects]]
  from = "/supabase"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

# Le code des fonctions, les exemples de variables et la documentation ne sont pas des pages du site : jamais servis
[[redirects]]
  from = "/netlify"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/catalogue/*"
  to = "/index.html"
  status = 200

# Page de suivi d'une livraison (lien envoyé au client par WhatsApp) : /suivi/<code secret>
[[redirects]]
  from = "/suivi/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/facture/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/facture/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/suivi/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/whatsapp/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
